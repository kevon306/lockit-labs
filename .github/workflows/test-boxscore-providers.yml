name: TEST - box score provider reachability (disposable)

# One-off diagnostic, not part of the app - confirms whether BALLDONTLIE and
# Highlightly are reachable from a GitHub Actions runner the way stats.nba.com isn't
# (see box_scores.py's own docstring for why that matters). Delete this file once the
# cloud-migration decision is made; it's not meant to stay.

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: BALLDONTLIE - /v1/teams (free tier, proves reachability only)
        run: |
          code=$(curl -s -o /tmp/bdl_teams.json -w "%{http_code}" \
            -H "Authorization: ${{ secrets.BALLDONTLIE_API_KEY }}" \
            "https://api.balldontlie.io/v1/teams?per_page=2")
          echo "HTTP status: $code"
          head -c 300 /tmp/bdl_teams.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::BALLDONTLIE not reachable or key rejected from this runner (status $code)"
            exit 1
          fi
          echo "BALLDONTLIE reachable from a GitHub Actions runner: yes"

      - name: BALLDONTLIE - /v1/stats (needs ALL-STAR+; expected 401 on a free key)
        run: |
          code=$(curl -s -o /tmp/bdl_stats.json -w "%{http_code}" \
            -H "Authorization: ${{ secrets.BALLDONTLIE_API_KEY }}" \
            "https://api.balldontlie.io/v1/stats?dates[]=2026-10-30&per_page=5")
          echo "HTTP status: $code"
          head -c 500 /tmp/bdl_stats.json
          echo

      - name: Highlightly - NBA matches list (free tier)
        run: |
          code=$(curl -s -o /tmp/hl_matches.json -w "%{http_code}" \
            -H "x-rapidapi-key: ${{ secrets.HIGHLIGHTLY_API_KEY }}" \
            "https://nba.highlightly.net/matches?date=2026-10-30")
          echo "HTTP status: $code"
          head -c 400 /tmp/hl_matches.json
          echo

      - name: Highlightly - NBA per-player box score, Raptors vs Magic 2026-10-30 (free tier)
        run: |
          code=$(curl -s -o /tmp/hl_box.json -w "%{http_code}" \
            -H "x-rapidapi-key: ${{ secrets.HIGHLIGHTLY_API_KEY }}" \
            "https://nba.highlightly.net/box-score/1549057")
          echo "HTTP status: $code"
          echo "Looking for Scottie Barnes' known 41 points (ground truth from our own box_scores table):"
          python3 -c "
          import json
          data = json.load(open('/tmp/hl_box.json'))
          for team in data:
              for p in team['boxScores']:
                  if 'Barnes' in p['player']['name']:
                      stats = {s['name']: s['value'] for s in p['statistics']}
                      print(p['player']['name'], '-> points:', stats.get('Total Points Scored'),
                            'rebounds:', stats.get('Total Rebounds'), 'assists:', stats.get('Total Assists'))
          " || echo "could not parse response, see raw output below"
          head -c 300 /tmp/hl_box.json
